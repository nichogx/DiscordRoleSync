stages:
  - lint
  - test
  - build
  - validate-release
  - pre-publish
  - publish

workflow:
  auto_cancel:
    # A new commit on the same branch cancels the old pipeline's interruptible jobs
    on_new_commit: interruptible

default:
  # Jobs that publish set this to false, so a release is never cancelled halfway
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

include:
  - project: "renovate-bot/renovate-runner"
    file: "/templates/renovate-config-validator.gitlab-ci.yml"

## Linting
###

.python:
  image: python:3.15-alpine
  cache:
    key: pip-$CI_JOB_NAME_SLUG
    paths:
      - .cache/pip/

language-linter:
  stage: lint
  extends: .python

  before_script:
    - cd src/test/language_validator
    - pip install -r requirements.txt
  script:
    - python validate.py en_US.yml ../../main/resources/language

changelog-linter:
  stage: lint

  image: python:3.15-alpine
  before_script:
    - cd ci
  script:
    - python validate_changelog.py

python-linter:
  stage: lint

  image: ghcr.io/astral-sh/ruff:0.17.3-alpine
  script:
    # Report for the MR widget, then fail the job with readable output if there are errors
    - ruff check --exit-zero --output-format=gitlab --output-file=gl-code-quality-report.json
    - ruff check
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      codequality: gl-code-quality-report.json

## Test & Build
###

.maven:
  # Use the oldest supported Java version to guarantee compatibility
  image: maven:3-eclipse-temurin-17
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/

python-infra-test:
  stage: test
  extends: .python

  before_script:
    - cd spigot_page
    - pip install -r requirements.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    expire_in: 30 days
    paths:
      - spigot_page/report.xml
    reports:
      junit: spigot_page/report.xml

python-ci-test:
  stage: test
  extends: .python

  before_script:
    - cd ci
    - pip install -r requirements-dev.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    expire_in: 30 days
    paths:
      - ci/report.xml
    reports:
      junit: ci/report.xml

maven-test:
  stage: test
  extends: .maven
  # Also test on the Java versions most servers run, to catch runtime differences
  image: maven:3-eclipse-temurin-${JAVA_VERSION}
  parallel:
    matrix:
      - JAVA_VERSION: ["17", "21", "25"]

  script:
    - mvn $MAVEN_CLI_OPTS test -Dpackage_version=ci-test

  artifacts:
    expire_in: 30 days
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/*.xml

maven-package:
  stage: build
  extends: .maven

  script:
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        PACKAGE_VERSION=${CI_COMMIT_TAG}
      elif [[ "$CI_COMMIT_REF_NAME" == "master" ]]; then
        PACKAGE_VERSION=master-${CI_COMMIT_SHORT_SHA}
      else
        PACKAGE_VERSION=branch-${CI_COMMIT_SHORT_SHA}
      fi
    # Tests already ran in maven-test
    - mvn $MAVEN_CLI_OPTS package -DskipTests -Dpackage_version=${PACKAGE_VERSION}
    # Hangar does not accept .jars bigger than 10MB. Keep in sync with MAX_JAR_SIZE in ci/common.py
    - |
      JAR_SIZE=$(stat -c %s target/discord_role_sync-${PACKAGE_VERSION}.jar)
      echo "JAR size: ${JAR_SIZE} bytes"
      if [[ "$JAR_SIZE" -gt 10000000 ]]; then
        echo "JAR is bigger than 10MB, which Hangar does not accept"
        exit 1
      fi

  artifacts:
    expire_in: 30 days
    paths:
      - target/discord_role_sync-*.jar

## Publish
###

validate-release:
  stage: validate-release
  extends: .python

  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python validate_release.py

gitlab-registry:
  stage: pre-publish
  interruptible: false

  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      PACKAGE_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/discord_role_sync/${CI_COMMIT_TAG}/discord_role_sync-${CI_COMMIT_TAG}.jar
      # Skip if already uploaded, e.g. when retrying the job
      if curl --fail --silent --output /dev/null --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$PACKAGE_URL"; then
        echo "Package already exists. Skipping upload."
        exit 0
      fi
      curl --fail-with-body \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file target/discord_role_sync-${CI_COMMIT_TAG}.jar \
        "$PACKAGE_URL"

publish-gitlab:
  stage: publish
  extends: .python
  interruptible: false

  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_gitlab.py

publish-modrinth:
  stage: publish
  extends: .python
  interruptible: false

  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_modrinth.py

publish-hangar:
  stage: publish
  extends: .python
  interruptible: false

  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_hangar.py

## Generate Spigot page description
###

generate-spigot-description:
  stage: build
  extends: .python

  before_script:
    - cd spigot_page
    - pip install -r requirements.txt
  script:
    - python markdown_to_bbcode.py ../README.md --out ./spigot_page.bb
  artifacts:
    expire_in: 30 days
    paths:
      - spigot_page/spigot_page.bb
