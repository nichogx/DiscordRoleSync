stages:
  - lint
  - test
  - build
  - validate-release
  - pre-publish
  - publish

workflow:
  auto_cancel:
    # A new commit on the same branch cancels the old pipeline's interruptible jobs
    on_new_commit: interruptible

default:
  # Jobs that publish set this to false, so a release is never cancelled halfway
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

include:
  - project: "renovate-bot/renovate-runner"
    file: "/templates/renovate-config-validator.gitlab-ci.yml"

## Linting
###

.python:
  image: python:3.15-alpine
  cache:
    key: pip-$CI_JOB_NAME_SLUG
    paths:
      - .cache/pip/

language-linter:
  stage: lint
  extends: .python

  before_script:
    - cd src/test/language_validator
    - pip install -r requirements.txt
  script:
    - python validate.py en_US.yml ../../main/resources/language

changelog-linter:
  stage: lint

  image: python:3.15-alpine
  before_script:
    - cd ci
  script:
    - python validate_changelog.py

python-linter:
  stage: lint

  image: ghcr.io/astral-sh/ruff:0.17.3-alpine
  script:
    # Report for the MR widget, then fail the job with readable output if there are errors
    - ruff check --exit-zero --output-format=gitlab --output-file=gl-code-quality-report.json
    - ruff check
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      codequality: gl-code-quality-report.json

secret-scanner:
  stage: lint

  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    # Scan the whole history, not just the latest commits
    GIT_DEPTH: 0
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Ignore false positives by adding their fingerprint to .gitleaksignore
    - gitleaks git --redact --verbose

# The wrapper JAR and the Gradle distribution it downloads run on every build, so make sure
# both are Gradle's official ones. The wrapper only accepts a distribution matching
# distributionSha256Sum, so checking that checksum also covers where it's downloaded from.
# If this fails after a Gradle update, regenerate the wrapper with ./gradlew wrapper
gradle-wrapper-checksum:
  stage: lint

  image: curlimages/curl:latest
  script:
    - |
      PROPERTIES=gradle/wrapper/gradle-wrapper.properties
      DISTRIBUTION=$(sed -nE 's#^distributionUrl=.*/(gradle-.+-(bin|all)\.zip)$#\1#p' "$PROPERTIES")
      GRADLE_VERSION=$(echo "$DISTRIBUTION" | sed -E 's#^gradle-(.+)-(bin|all)\.zip$#\1#')
      if [ -z "$GRADLE_VERSION" ]; then
        echo "Could not read the Gradle version from distributionUrl in $PROPERTIES"
        exit 1
      fi

      WRAPPER_EXPECTED=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-wrapper.jar.sha256")
      WRAPPER_ACTUAL=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
      echo "gradle-wrapper.jar for Gradle ${GRADLE_VERSION}: expected ${WRAPPER_EXPECTED}, got ${WRAPPER_ACTUAL}"

      DISTRIBUTION_EXPECTED=$(curl -fsSL "https://services.gradle.org/distributions/${DISTRIBUTION}.sha256")
      DISTRIBUTION_ACTUAL=$(sed -n 's/^distributionSha256Sum=//p' "$PROPERTIES")
      echo "distributionSha256Sum for ${DISTRIBUTION}: expected ${DISTRIBUTION_EXPECTED}, got ${DISTRIBUTION_ACTUAL}"

      if [ "$WRAPPER_EXPECTED" != "$WRAPPER_ACTUAL" ]; then
        echo "gradle-wrapper.jar is not the official wrapper for Gradle ${GRADLE_VERSION}"
        exit 1
      fi
      if [ "$DISTRIBUTION_EXPECTED" != "$DISTRIBUTION_ACTUAL" ]; then
        echo "distributionSha256Sum in $PROPERTIES is not the official checksum of ${DISTRIBUTION}"
        exit 1
      fi

## Test & Build
###

.gradle:
  # Use the oldest supported Java version to guarantee compatibility
  image: eclipse-temurin:17-jdk
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_CLI_OPTS: "--console=plain"
  cache:
    key:
      files:
        - gradle/wrapper/gradle-wrapper.properties
        - gradle/libs.versions.toml
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/

python-ci-test:
  stage: test
  extends: .python

  before_script:
    - cd ci
    - pip install -r requirements-dev.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    expire_in: 30 days
    paths:
      - ci/report.xml
    reports:
      junit: ci/report.xml

gradle-test:
  stage: test
  extends: .gradle

  script:
    - ./gradlew $GRADLE_CLI_OPTS test -Ppackage_version=ci-test
    # Total line coverage, for the coverage regex below
    - |
      awk -F, 'NR > 1 { missed += $8; covered += $9 } END { printf "Line coverage: %.2f%%\n", 100 * covered / (missed + covered) }' build/reports/jacoco/test/jacocoTestReport.csv
  coverage: '/Line coverage: \d+\.\d+%/'

  artifacts:
    expire_in: 30 days
    paths:
      - build/test-results/test/
      - build/reports/jacoco/test/
    reports:
      junit: build/test-results/test/*.xml
      coverage_report:
        coverage_format: jacoco
        path: build/reports/jacoco/test/jacocoTestReport.xml

spotbugs:
  stage: test
  extends: .gradle

  script:
    - ./gradlew $GRADLE_CLI_OPTS spotbugsMain -Ppackage_version=ci-test
  artifacts:
    # The findings are only listed in the HTML report
    when: on_failure
    expire_in: 30 days
    paths:
      - build/reports/spotbugs/

gradle-package:
  stage: build
  extends: .gradle

  script:
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        PACKAGE_VERSION=${CI_COMMIT_TAG}
      elif [[ "$CI_COMMIT_REF_NAME" == "master" ]]; then
        PACKAGE_VERSION=master-${CI_COMMIT_SHORT_SHA}
      else
        PACKAGE_VERSION=branch-${CI_COMMIT_SHORT_SHA}
      fi
    # Tests already ran in gradle-test
    - ./gradlew $GRADLE_CLI_OPTS shadowJar -Ppackage_version=${PACKAGE_VERSION}
    # Hangar does not accept .jars bigger than 10MB. Keep in sync with MAX_JAR_SIZE in ci/common.py
    - |
      JAR_SIZE=$(stat -c %s build/libs/discord_role_sync-${PACKAGE_VERSION}.jar)
      echo "JAR size: ${JAR_SIZE} bytes"
      if [[ "$JAR_SIZE" -gt 10000000 ]]; then
        echo "JAR is bigger than 10MB, which Hangar does not accept"
        exit 1
      fi

  artifacts:
    expire_in: 30 days
    paths:
      - build/libs/discord_role_sync-*.jar

## Publish
###

# The publish jobs skip anything already published, so they are safe to retry
# when the runner or GitLab fails, rather than the job itself.
.retry-on-infra-failure:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure

validate-release:
  stage: validate-release
  extends: .python

  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python validate_release.py

gitlab-registry:
  stage: pre-publish
  interruptible: false

  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  retry: !reference [.retry-on-infra-failure, retry]
  script:
    # The Spigot files are linked in the GitLab release, for the manual Spigot upload
    - ./ci/upload_package.sh
      build/libs/discord_role_sync-${CI_COMMIT_TAG}.jar
      spigot_page/spigot_page.bbcode
      spigot_page/spigot_changelog.bbcode

publish-gitlab:
  stage: publish
  extends: .python
  interruptible: false

  rules:
    - if: $CI_COMMIT_TAG
  retry: !reference [.retry-on-infra-failure, retry]
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_gitlab.py

publish-modrinth:
  stage: publish
  extends: .python
  interruptible: false

  rules:
    - if: $CI_COMMIT_TAG
  retry: !reference [.retry-on-infra-failure, retry]
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_modrinth.py

publish-hangar:
  stage: publish
  extends: .python
  interruptible: false

  rules:
    - if: $CI_COMMIT_TAG
  retry: !reference [.retry-on-infra-failure, retry]
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_hangar.py

## Generate Spigot page description and changelog
###

generate-spigot-description:
  stage: build
  image:
    name: pandoc/core:3.11
    entrypoint: [""]

  script:
    - pandoc -f gfm -t bbcode_xenforo --lua-filter spigot_page/spigot_bbcode.lua README.md -o spigot_page/spigot_page.bbcode
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        apk add --no-cache python3
        (cd ci && python3 export_changelog.py "$CI_COMMIT_TAG" --out ../spigot_page/spigot_changelog.md)
        pandoc -f gfm -t bbcode_xenforo --lua-filter spigot_page/spigot_bbcode.lua spigot_page/spigot_changelog.md -o spigot_page/spigot_changelog.bbcode
      fi
  artifacts:
    expire_in: 30 days
    paths:
      - spigot_page/spigot_page.bbcode
      - spigot_page/spigot_changelog.bbcode
