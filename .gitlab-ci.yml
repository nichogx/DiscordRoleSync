# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
stages:
  - lint
  - test
  - build
  - validate-release
  - pre-publish
  - publish

## SAST -- default linter
###

sast:
  stage: lint

include:
  - template: "Security/SAST.gitlab-ci.yml"
  - project: "renovate-bot/renovate-runner"
    file: "/templates/renovate-config-validator.gitlab-ci.yml"

## Linting
###

language-linter:
  stage: lint

  image: python:3.15-alpine
  before_script:
    - cd src/test/language_validator
    - pip install -r requirements.txt
  script:
    - python validate.py en_US.yml ../../main/resources/language

## Test & Build
###

.maven:
  # Use Java 11 to guarantee compatibility with servers using old Java
  image: maven:3-eclipse-temurin-11
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
    MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/

python-infra-test:
  stage: test

  image: python:3.15-alpine
  before_script:
    - cd spigot_page
    - pip install -r requirements.txt
  script:
    - pytest --junitxml=report.xml
  artifacts:
    expire_in: 30 days
    paths:
      - spigot_page/report.xml
    reports:
      junit: spigot_page/report.xml

maven-test:
  stage: test
  extends: .maven

  script:
    - mvn $MAVEN_CLI_OPTS test -Dpackage_version=ci-test

  artifacts:
    expire_in: 30 days
    paths:
      - target/surefire-reports/
    reports:
      junit: target/surefire-reports/*.xml

maven-package:
  stage: build
  extends: .maven

  script:
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        PACKAGE_VERSION=${CI_COMMIT_TAG}
      elif [[ "$CI_COMMIT_REF_NAME" == "master" ]]; then
        PACKAGE_VERSION=master-${CI_COMMIT_SHORT_SHA}
      else
        PACKAGE_VERSION=branch-${CI_COMMIT_SHORT_SHA}
      fi
    # Tests already ran in maven-test
    - mvn $MAVEN_CLI_OPTS package -DskipTests -Dpackage_version=${PACKAGE_VERSION}
    # Hangar does not accept .jars bigger than 10MB. Keep in sync with MAX_JAR_SIZE in ci/common.py
    - |
      JAR_SIZE=$(stat -c %s target/discord_role_sync-${PACKAGE_VERSION}.jar)
      echo "JAR size: ${JAR_SIZE} bytes"
      if [[ "$JAR_SIZE" -gt 10000000 ]]; then
        echo "JAR is bigger than 10MB, which Hangar does not accept"
        exit 1
      fi

  artifacts:
    expire_in: 30 days
    paths:
      - target/discord_role_sync-*.jar

## Publish
###

validate-release:
  stage: validate-release

  image: python:3.15-alpine
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python validate_release.py

gitlab-registry:
  stage: pre-publish

  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      PACKAGE_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/discord_role_sync/${CI_COMMIT_TAG}/discord_role_sync-${CI_COMMIT_TAG}.jar
      # Skip if already uploaded, e.g. when retrying the job
      if curl --fail --silent --output /dev/null --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "$PACKAGE_URL"; then
        echo "Package already exists. Skipping upload."
        exit 0
      fi
      curl --fail-with-body \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file target/discord_role_sync-${CI_COMMIT_TAG}.jar \
        "$PACKAGE_URL"

publish-gitlab:
  stage: publish

  image: python:3.15-alpine
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_gitlab.py

publish-modrinth:
  stage: publish

  image: python:3.15-alpine
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_modrinth.py

publish-hangar:
  stage: publish

  image: python:3.15-alpine
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - cd ci
    - pip install -r requirements.txt
  script:
    - python publish_hangar.py

## Generate Spigot page description
###

generate-spigot-description:
  stage: build

  image: python:3.15-alpine
  before_script:
    - cd spigot_page
    - pip install -r requirements.txt
  script:
    - python markdown_to_bbcode.py ../README.md --out ./spigot_page.bb
  artifacts:
    expire_in: 30 days
    paths:
      - spigot_page/spigot_page.bb
